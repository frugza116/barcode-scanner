<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>ทดสอบกล้อง Barcode</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
  background:#f2f2f2;
}

.box{
  max-width:500px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
  text-align:center;
}

#reader{
  width:100%;
  margin-top:15px;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#eee;
  text-align:center;
  line-height:1.6;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#4a148c;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.result{
  margin-top:15px;
  padding:15px;
  background:#e8f5e9;
  border-radius:12px;
  display:none;
  text-align:center;
}

</style>

</head>


<body>

<div class="box">

<h2>📷 ทดสอบกล้องมือถือ</h2>

<div id="reader"></div>

<div
  id="status"
  class="status">

กำลังตรวจสอบกล้อง...

</div>

<div
  id="result"
  class="result">

✅ สแกนสำเร็จ

<div
  id="resultText"
  style="font-size:24px;font-weight:bold;margin-top:10px;">
</div>

</div>

<button
  onclick="startCamera()">

📷 เปิดกล้อง

</button>

<button
  onclick="stopCamera()">

✕ ปิดกล้อง

</button>

</div>


<script>

let scanner = null;

let running = false;


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  const status =
    document.getElementById('status');


  status.innerHTML =
    'กำลังตรวจสอบระบบกล้อง...';


  /* ===================================================
     CHECK HTTPS
  =================================================== */

  if(
    location.protocol !== 'https:' &&
    location.hostname !== 'localhost'
  ){

    status.innerHTML =
      '❌ หน้านี้ไม่ได้เปิดผ่าน HTTPS';

    return;

  }


  /* ===================================================
     CHECK BROWSER CAMERA API
  =================================================== */

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    status.innerHTML =
      '❌ Browser นี้ไม่รองรับการใช้งานกล้อง';

    return;

  }


  /* ===================================================
     REQUEST CAMERA PERMISSION DIRECTLY
  =================================================== */

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:true
      });


    /* ปิด stream ทดสอบ */

    stream
      .getTracks()
      .forEach(track => {
        track.stop();
      });


    status.innerHTML =
      '✅ ได้รับสิทธิ์ใช้กล้องแล้ว<br>' +
      'กำลังเปิดตัวสแกน...';


  }
  catch(error){

    console.error(error);


    status.innerHTML =
      '❌ ไม่สามารถใช้กล้องได้<br><br>' +
      'Error: ' +
      error.name +
      '<br>' +
      error.message;


    return;

  }


  /* ===================================================
     START BARCODE SCANNER
  =================================================== */

  if(running){
    return;
  }


  scanner =
    new Html5Qrcode('reader');


  running = true;


  scanner

    .start(

      {
        facingMode:'environment'
      },

      {
        fps:10,

        qrbox:{
          width:280,
          height:160
        }

      },

      onScanSuccess,

      onScanError

    )

    .then(() => {

      status.innerHTML =
        '📷 กล้องพร้อมใช้งาน<br>' +
        'นำ Barcode ไปไว้ในกรอบ';

    })

    .catch(error => {

      console.error(error);

      running = false;

      status.innerHTML =
        '❌ เปิดตัว Scanner ไม่สำเร็จ<br>' +
        error;

    });

}


/* =====================================================
   SUCCESS
===================================================== */

function onScanSuccess(
  decodedText
){

  document.getElementById(
    'result'
  ).style.display =
    'block';


  document.getElementById(
    'resultText'
  ).textContent =
    decodedText;


  document.getElementById(
    'status'
  ).innerHTML =
    '✅ สแกน Barcode สำเร็จ';


  stopCamera();


  /* ส่งกลับหน้าเดิม */

  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(

      {
        type:
          'BARCODE_SCANNED',

        barcode:
          decodedText
      },

      '*'

    );

  }

}


/* =====================================================
   ERROR
===================================================== */

function onScanError(){
  // ไม่ต้องแสดง error ทุก frame
}


/* =====================================================
   STOP
===================================================== */

function stopCamera(){

  if(
    scanner &&
    running
  ){

    scanner
      .stop()
      .then(() => {

        scanner.clear();

        scanner = null;

        running = false;

      })
      .catch(() => {

        scanner = null;

        running = false;

      });

  }

}

</script>

</body>

</html>
