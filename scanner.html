<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>สแกน Barcode สินค้า</title>


<script src="https://unpkg.com/html5-qrcode"></script>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde2e4,
      #e0f4ff
    );

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:flex-start;

  padding:12px;

}


.container{

  width:100%;

  max-width:500px;

  margin-top:5px;

}


.card{

  width:100%;

  background:#fff;

  border-radius:22px;

  padding:16px;

  box-shadow:
    0 10px 28px
    rgba(0,0,0,.16);

}


.title{

  text-align:center;

  font-size:23px;

  font-weight:900;

  color:#4a148c;

  margin-bottom:5px;

}


.subtitle{

  text-align:center;

  color:#666;

  font-size:14px;

  line-height:1.5;

  margin-bottom:14px;

}


#reader{

  width:100%;

  min-height:260px;

  overflow:hidden;

  border-radius:18px;

  background:#111;

}


#reader video{

  width:100% !important;

  height:auto !important;

  display:block;

  border-radius:18px;

}


.status{

  margin-top:14px;

  padding:12px 14px;

  border-radius:14px;

  text-align:center;

  font-size:14px;

  line-height:1.6;

}


.status.info{

  background:#ede7f6;

  color:#4a148c;

}


.status.success{

  background:#e8f5e9;

  color:#1b5e20;

}


.status.error{

  background:#ffebee;

  color:#b71c1c;

}


.result{

  display:none;

  margin-top:14px;

  padding:16px;

  border-radius:16px;

  background:#f4effb;

  text-align:center;

}


.result-label{

  color:#666;

  font-size:13px;

  margin-bottom:6px;

}


.result-code{

  color:#4a148c;

  font-size:25px;

  font-weight:900;

  word-break:break-all;

}


.camera-select{

  width:100%;

  padding:13px;

  margin-top:12px;

  border:none;

  border-radius:14px;

  background:#f7f7f7;

  font-size:15px;

  display:none;

}


button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:15px;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

}


.open-btn{

  background:#4a148c;

  color:#fff;

}


.retry-btn{

  display:none;

  background:#4a148c;

  color:#fff;

}


.close-btn{

  background:#eee;

  color:#555;

}


.help{

  margin-top:14px;

  padding:12px;

  border-radius:14px;

  background:#fafafa;

  color:#666;

  font-size:13px;

  line-height:1.6;

  text-align:center;

}


@media(max-width:600px){

  body{
    padding:8px;
  }

  .card{
    padding:13px;
  }

  .title{
    font-size:21px;
  }

  #reader{
    min-height:240px;
  }

}

</style>

</head>


<body>


<div class="container">

  <div class="card">


    <div class="title">

      📷 สแกน Barcode สินค้า

    </div>


    <div class="subtitle">

      หันกล้องหลังมือถือไปที่ Barcode<br>

      เช่น 8850051034149

    </div>


    <div id="reader"></div>


    <div
      id="status"
      class="status info">

      กด
      <b>📷 เปิดกล้อง</b>
      เพื่อเริ่มสแกน

    </div>


    <select
      id="cameraSelect"
      class="camera-select">
    </select>


    <div
      id="result"
      class="result">

      <div class="result-label">

        Barcode ที่สแกนได้

      </div>


      <div
        id="resultCode"
        class="result-code">
      </div>

    </div>


    <button
      id="openBtn"
      class="open-btn"
      onclick="startCamera()">

      📷 เปิดกล้อง

    </button>


    <button
      id="retryBtn"
      class="retry-btn"
      onclick="restartScanner()">

      🔄 สแกนใหม่

    </button>


    <button
      class="close-btn"
      onclick="closeScanner()">

      ✕ ปิดหน้าสแกน

    </button>


    <div class="help">

      ระบบจะใช้กล้องหลังมือถือก่อน<br>

      เมื่อสแกนสำเร็จ
      ระบบจะส่ง Barcode กลับไป Apps Script

    </div>


  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */


/*
  URL Web App ของ Google Apps Script

  ตัวอย่าง:

  https://script.google.com/macros/s/AKfycbxxxxxx/exec
*/

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbyLp5KF3m1VRnlhpsZoNOB3-iIPJk6TGJ_-F1rjUBZw_i2ksN1Q-U1e7HqFb54OgK5T/exec';


/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let running = false;

let scanned = false;

let sessionId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
  document.getElementById(
    'status'
  );

const resultEl =
  document.getElementById(
    'result'
  );

const resultCodeEl =
  document.getElementById(
    'resultCode'
  );

const openBtn =
  document.getElementById(
    'openBtn'
  );

const retryBtn =
  document.getElementById(
    'retryBtn'
  );

const cameraSelect =
  document.getElementById(
    'cameraSelect'
  );


/* =====================================================
   SESSION FROM URL
===================================================== */

function getSessionId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return String(
    params.get(
      'session'
    ) || ''
  ).trim();

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  type = 'info'
){

  statusEl.innerHTML =
    message;

  statusEl.className =
    'status ' +
    type;

}


/* =====================================================
   CHECK CONFIG
===================================================== */

function checkConfig(){

  if(
    !SCRIPT_URL ||
    SCRIPT_URL.includes(
      'ใส่_DEPLOYMENT_ID'
    )
  ){

    setStatus(
      '❌ ยังไม่ได้ใส่ URL Apps Script',
      'error'
    );

    return false;

  }


  sessionId =
    getSessionId();


  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Scan Session',
      'error'
    );

    return false;

  }


  return true;

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  if(running){
    return;
  }


  if(
    !checkConfig()
  ){

    return;

  }


  scanned =
    false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  retryBtn.style.display =
    'none';


  cameraSelect.style.display =
    'none';


  openBtn.style.display =
    'none';


  setStatus(
    'กำลังเปิดกล้อง...',
    'info'
  );


  /*
    ตรวจ HTTPS
  */

  if(
    location.protocol !==
    'https:'
  ){

    setStatus(
      '❌ GitHub Pages ต้องเปิดผ่าน HTTPS',
      'error'
    );


    openBtn.style.display =
      'block';


    return;

  }


  /*
    ตรวจ Library
  */

  if(
    typeof Html5Qrcode ===
    'undefined'
  ){

    setStatus(
      '❌ โหลดระบบ Scanner ไม่สำเร็จ',
      'error'
    );


    openBtn.style.display =
      'block';


    return;

  }


  /*
    สร้าง Scanner
  */

  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );


  }
  catch(error){

    console.error(
      error
    );


    setStatus(
      '❌ สร้าง Scanner ไม่สำเร็จ',
      'error'
    );


    openBtn.style.display =
      'block';


    return;

  }


  /*
    เปิดกล้องหลัง
  */

  try{

    running =
      true;


    await scanner.start(

      'environment',

      {
        fps:10,

        qrbox:{
          width:280,
          height:160
        },

        aspectRatio:1.777

      },

      onScanSuccess,

      onScanError

    );


    setStatus(
      '📷 กล้องพร้อมใช้งาน<br>' +
      'นำ Barcode มาไว้ในกรอบ',
      'success'
    );


    return;

  }
  catch(error){

    console.warn(
      'Environment camera error:',
      error
    );


    running =
      false;

  }


  /*
    ถ้าเปิด environment ไม่ได้
    ให้เลือกจากรายการกล้อง
  */

  try{

    const cameras =
      await Html5Qrcode.getCameras();


    if(
      !cameras ||
      cameras.length === 0
    ){

      throw new Error(
        'ไม่พบกล้อง'
      );

    }


    fillCameraList(
      cameras
    );


    cameraSelect.style.display =
      'block';


    setStatus(
      'พบกล้องแล้ว<br>' +
      'กรุณาเลือกกล้อง',
      'info'
    );


    if(
      cameras.length === 1
    ){

      cameraSelect.value =
        cameras[0].id;


      await startWithCameraId(
        cameras[0].id
      );

    }

  }
  catch(error){

    console.error(
      error
    );


    setStatus(
      '❌ ไม่สามารถเปิดกล้องได้<br>' +
      'กรุณาตรวจสอบสิทธิ์ Camera',
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';

  }

}


/* =====================================================
   CAMERA LIST
===================================================== */

function fillCameraList(
  cameras
){

  cameraSelect.innerHTML =
    '';


  cameras.forEach(
    function(
      camera,
      index
    ){

      const option =
        document.createElement(
          'option'
        );


      option.value =
        camera.id;


      option.textContent =
        camera.label ||
        (
          'กล้อง ' +
          (index + 1)
        );


      cameraSelect.appendChild(
        option
      );

    }
  );


  cameraSelect.onchange =
    async function(){

      const cameraId =
        this.value;


      if(!cameraId){
        return;
      }


      await restartWithCameraId(
        cameraId
      );

    };

}


/* =====================================================
   START WITH CAMERA ID
===================================================== */

async function startWithCameraId(
  cameraId
){

  try{

    if(!scanner){

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }


    running =
      true;


    await scanner.start(

      cameraId,

      {
        fps:10,

        qrbox:{
          width:280,
          height:160
        }

      },

      onScanSuccess,

      onScanError

    );


    setStatus(
      '📷 กล้องพร้อมใช้งาน<br>' +
      'นำ Barcode มาไว้ในกรอบ',
      'success'
    );

  }
  catch(error){

    console.error(
      error
    );


    running =
      false;


    setStatus(
      '❌ เปิดกล้องนี้ไม่สำเร็จ',
      'error'
    );


    retryBtn.style.display =
      'block';

  }

}


/* =====================================================
   RESTART CAMERA ID
===================================================== */

async function restartWithCameraId(
  cameraId
){

  await stopScanner();


  setTimeout(
    function(){

      startWithCameraId(
        cameraId
      );

    },
    300
  );

}


/* =====================================================
   SCAN SUCCESS
===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
){

  if(scanned){
    return;
  }


  const barcode =
    String(
      decodedText || ''
    ).trim();


  if(!barcode){
    return;
  }


  scanned =
    true;


  resultCodeEl.textContent =
    barcode;


  resultEl.style.display =
    'block';


  setStatus(
    '✅ สแกนสำเร็จ<br>' +
    'กำลังส่งข้อมูล...',
    'success'
  );


  stopScanner()
    .then(
      function(){

        sendBarcodeToApp(
          barcode
        );

      }
    );

}


/* =====================================================
   SCAN ERROR
===================================================== */

function onScanError(){
  /*
    ไม่แสดง error ทุก frame
  */
}


/* =====================================================
   SEND BARCODE TO APPS SCRIPT
===================================================== */

function sendBarcodeToApp(
  barcode
){

  const params =
    new URLSearchParams();


  params.set(
    'action',
    'saveScan'
  );


  params.set(
    'session',
    sessionId
  );


  params.set(
    'barcode',
    barcode
  );


  const url =
    SCRIPT_URL +
    '?' +
    params.toString() +
    '&t=' +
    Date.now();


  /*
    ใช้ Image Beacon
    เพื่อไม่ติด CORS
  */

  const img =
    new Image();


  img.onload =
    function(){

      setStatus(
        '✅ ส่ง Barcode กลับระบบแล้ว<br>' +
        'กำลังกลับหน้าระบบ...',
        'success'
      );


      setTimeout(
        function(){

          closeWindow();

        },
        600
      );

    };


  img.onerror =
    function(){

      /*
        แม้ Image error
        คำขอ GET มักถูกส่งออกไปแล้ว
        ให้รอ Apps Script Poll ต่อ
      */

      setStatus(
        '✅ ส่ง Barcode แล้ว<br>' +
        'กำลังกลับหน้าระบบ...',
        'success'
      );


      setTimeout(
        function(){

          closeWindow();

        },
        600
      );

    };


  img.src =
    url;

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){

    return;

  }


  const current =
    scanner;


  scanner =
    null;


  running =
    false;


  try{

    await current.stop();

  }
  catch(error){

    console.log(
      error
    );

  }


  try{

    current.clear();

  }
  catch(error){

    console.log(
      error
    );

  }

}


/* =====================================================
   RETRY
===================================================== */

async function restartScanner(){

  await stopScanner();


  scanned =
    false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  cameraSelect.style.display =
    'none';


  setStatus(
    'กำลังเตรียมกล้อง...',
    'info'
  );


  setTimeout(
    function(){

      startCamera();

    },
    300
  );

}


/* =====================================================
   CLOSE WINDOW
===================================================== */

async function closeScanner(){

  await stopScanner();


  /*
    แจ้งยกเลิก Session
  */

  if(
    SCRIPT_URL &&
    sessionId
  ){

    const params =
      new URLSearchParams();


    params.set(
      'action',
      'cancelScan'
    );


    params.set(
      'session',
      sessionId
    );


    const img =
      new Image();


    img.src =
      SCRIPT_URL +
      '?' +
      params.toString() +
      '&t=' +
      Date.now();

  }


  closeWindow();

}


/* =====================================================
   CLOSE WINDOW
===================================================== */

function closeWindow(){

  try{

    window.close();

  }
  catch(e){}


  setTimeout(
    function(){

      if(
        !window.closed
      ){

        history.back();

      }

    },
    300
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/* =====================================================
   START AUTOMATICALLY
===================================================== */

window.addEventListener(
  'load',
  function(){

    /*
      ไม่เปิดกล้องทันที
      ให้ผู้ใช้กดปุ่มก่อน
      เพื่อให้ Browser ยอมให้ Camera
    */

  }
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  'beforeunload',
  function(){

    try{

      if(
        scanner &&
        running
      ){

        scanner
          .stop()
          .catch(
            function(){}
          );

      }

    }
    catch(e){}

  }
);

</script>

</body>

</html>
