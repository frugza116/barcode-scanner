<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>สแกน Barcode สินค้า</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  padding:10px;

  min-height:100vh;

  font-family:
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde2e4,
      #e0f4ff
    );

}

.card{

  width:100%;

  max-width:500px;

  margin:auto;

  padding:15px;

  background:#fff;

  border-radius:22px;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.15);

}

.title{

  text-align:center;

  color:#4a148c;

  font-size:22px;

  font-weight:900;

  margin-bottom:6px;

}

.subtitle{

  text-align:center;

  color:#666;

  font-size:14px;

  margin-bottom:15px;

}

#reader{

  width:100%;

  min-height:250px;

  overflow:hidden;

  border-radius:18px;

  background:#111;

}

#reader video{

  width:100% !important;

  height:auto !important;

}

.status{

  margin-top:12px;

  padding:12px;

  border-radius:14px;

  text-align:center;

  line-height:1.6;

  font-size:14px;

}

.info{

  background:#ede7f6;

  color:#4a148c;

}

.success{

  background:#e8f5e9;

  color:#1b5e20;

}

.error{

  background:#ffebee;

  color:#b71c1c;

}

.result{

  display:none;

  margin-top:12px;

  padding:15px;

  border-radius:15px;

  background:#f4effb;

  text-align:center;

}

.result-code{

  margin-top:5px;

  color:#4a148c;

  font-size:24px;

  font-weight:900;

  word-break:break-all;

}

button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:15px;

  font-size:16px;

  font-weight:800;

}

.open-btn{

  background:#4a148c;

  color:#fff;

}

.retry-btn{

  display:none;

  background:#4a148c;

  color:#fff;

}

.close-btn{

  background:#eee;

  color:#555;

}

</style>

</head>


<body>

<div class="card">


  <div class="title">
    📷 สแกน Barcode สินค้า
  </div>


  <div class="subtitle">
    หันกล้องหลังมือถือไปที่ Barcode
  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status info">

    กด
    <b>📷 เปิดกล้อง</b>

  </div>


  <div
    id="result"
    class="result">

    Barcode ที่อ่านได้

    <div
      id="resultCode"
      class="result-code">
    </div>

  </div>


  <button
    id="openBtn"
    class="open-btn"
    onclick="startCamera()">

    📷 เปิดกล้อง

  </button>


  <button
    id="retryBtn"
    class="retry-btn"
    onclick="restartScanner()">

    🔄 สแกนใหม่

  </button>


  <button
    class="close-btn"
    onclick="closeScanner()">

    ✕ ปิด

  </button>


</div>


<script>


/* =====================================================
   CONFIG
===================================================== */


/*
  URL Web App ของ Apps Script

  สำคัญ:
  ต้องเป็น /exec
*/

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycby8Gizou10murE7uFHv9_3vB7q0Dpy5M-HkjhtHwYRENITNXvrLaAwX2TNOHJArKPem/exec';


/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let running = false;

let scanned = false;

let sessionId = null;

let sendFinished = false;


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
  document.getElementById(
    'status'
  );

const resultEl =
  document.getElementById(
    'result'
  );

const resultCodeEl =
  document.getElementById(
    'resultCode'
  );

const openBtn =
  document.getElementById(
    'openBtn'
  );

const retryBtn =
  document.getElementById(
    'retryBtn'
  );


/* =====================================================
   SESSION
===================================================== */

function getSession(){

  const params =
    new URLSearchParams(
      location.search
    );


  return String(
    params.get(
      'session'
    ) || ''
  ).trim();

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  type='info'
){

  statusEl.innerHTML =
    text;

  statusEl.className =
    'status ' +
    type;

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  if(running){
    return;
  }


  sessionId =
    getSession();


  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Session ID',
      'error'
    );

    return;

  }


  scanned =
    false;

  sendFinished =
    false;


  resultEl.style.display =
    'none';


  retryBtn.style.display =
    'none';


  openBtn.style.display =
    'none';


  setStatus(
    '📷 กำลังเปิดกล้อง...',
    'info'
  );


  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );


    running =
      true;


    await scanner.start(

      'environment',

      {

        fps:10,

        qrbox:{
          width:280,
          height:160
        }

      },

      onScanSuccess,

      function(){}

    );


    setStatus(
      '📷 กล้องพร้อมใช้งาน<br>' +
      'นำ Barcode มาไว้ในกรอบ',
      'success'
    );

  }

  catch(error){

    console.error(
      error
    );


    running =
      false;


    scanner =
      null;


    setStatus(
      '❌ เปิดกล้องไม่ได้<br>' +
      String(error),
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';

  }

}


/* =====================================================
   SCAN SUCCESS
===================================================== */

function onScanSuccess(
  decodedText
){

  if(scanned){
    return;
  }


  const barcode =
    String(
      decodedText || ''
    ).trim();


  if(!barcode){
    return;
  }


  scanned =
    true;


  resultCodeEl.textContent =
    barcode;


  resultEl.style.display =
    'block';


  setStatus(
    '✅ สแกนได้แล้ว<br>' +
    'กำลังส่งข้อมูลเข้า Apps Script...',
    'success'
  );


  stopScanner()
    .then(
      function(){

        sendBarcode(
          barcode
        );

      }
    );

}


/* =====================================================
   SEND BARCODE
===================================================== */

function sendBarcode(
  barcode
){

  if(sendFinished){
    return;
  }


  if(!SCRIPT_URL){

    setStatus(
      '❌ ไม่พบ URL Apps Script',
      'error'
    );

    return;

  }


  const url =
    SCRIPT_URL +
    '?action=saveScan' +
    '&session=' +
    encodeURIComponent(
      sessionId
    ) +
    '&barcode=' +
    encodeURIComponent(
      barcode
    ) +
    '&t=' +
    Date.now();


  console.log(
    'SEND URL:',
    url
  );


  /*
    สร้าง Image request
  */

  const img =
    new Image();


  let done =
    false;


  const finish =
    function(){

      if(done){
        return;
      }


      done =
        true;

      sendFinished =
        true;


      setStatus(
        '✅ ส่ง Barcode เข้า Apps Script แล้ว<br>' +
        'กำลังกลับหน้าหลัก...',
        'success'
      );


      setTimeout(
        function(){

          closeScannerWindow();

        },
        1000
      );

    };


  img.onload =
    finish;


  img.onerror =
    finish;


  img.src =
    url;


  /*
    กัน Browser ไม่ยิง event
  */

  setTimeout(
    finish,
    3000
  );

}


/* =====================================================
   STOP
===================================================== */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){

    return;
  }


  const current =
    scanner;


  scanner =
    null;


  running =
    false;


  try{

    await current.stop();

  }
  catch(e){}


  try{

    current.clear();

  }
  catch(e){}

}


/* =====================================================
   RETRY
===================================================== */

async function restartScanner(){

  await stopScanner();


  scanned =
    false;


  sendFinished =
    false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  setStatus(
    '📷 กำลังเตรียมกล้อง...',
    'info'
  );


  setTimeout(
    function(){

      startCamera();

    },
    300
  );

}


/* =====================================================
   CLOSE
===================================================== */

async function closeScanner(){

  await stopScanner();


  closeScannerWindow();

}


/* =====================================================
   CLOSE WINDOW
===================================================== */

function closeScannerWindow(){

  try{

    window.close();

  }
  catch(e){}


  setTimeout(
    function(){

      if(
        !window.closed
      ){

        history.back();

      }

    },
    300
  );

}

</script>

</body>

</html>
