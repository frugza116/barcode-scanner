<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>สแกน Barcode สินค้า</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
  padding:0;
}

body{

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde2e4,
      #e0f4ff
    );

  padding:10px;

}

.container{

  width:100%;

  max-width:520px;

  margin:0 auto;

}

.card{

  background:#fff;

  border-radius:22px;

  padding:16px;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.15);

}

.title{

  text-align:center;

  color:#4a148c;

  font-size:23px;

  font-weight:900;

  margin-bottom:6px;

}

.subtitle{

  text-align:center;

  color:#666;

  font-size:14px;

  line-height:1.5;

  margin-bottom:15px;

}

#reader{

  width:100%;

  min-height:260px;

  border-radius:18px;

  overflow:hidden;

  background:#111;

}

#reader video{

  width:100% !important;

  height:auto !important;

  display:block;

  border-radius:18px;

}

.status{

  margin-top:13px;

  padding:13px;

  border-radius:14px;

  text-align:center;

  font-size:14px;

  line-height:1.6;

}

.status.info{

  background:#ede7f6;

  color:#4a148c;

}

.status.success{

  background:#e8f5e9;

  color:#1b5e20;

}

.status.error{

  background:#ffebee;

  color:#b71c1c;

}

.result{

  display:none;

  margin-top:13px;

  padding:16px;

  border-radius:16px;

  background:#f4effb;

  text-align:center;

}

.result-label{

  color:#666;

  font-size:13px;

}

.result-code{

  margin-top:6px;

  color:#4a148c;

  font-size:25px;

  font-weight:900;

  word-break:break-all;

}

button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:15px;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

}

.open-btn{

  background:#4a148c;

  color:#fff;

}

.retry-btn{

  display:none;

  background:#4a148c;

  color:#fff;

}

.close-btn{

  background:#eee;

  color:#555;

}

.help{

  margin-top:14px;

  padding:12px;

  border-radius:14px;

  background:#fafafa;

  color:#666;

  font-size:13px;

  line-height:1.6;

  text-align:center;

}

</style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- TITLE -->

    <div class="title">
      📷 สแกน Barcode สินค้า
    </div>


    <div class="subtitle">
      ระบบจะเลือกกล้องหลังมือถือให้อัตโนมัติ
    </div>


    <!-- CAMERA -->

    <div id="reader"></div>


    <!-- STATUS -->

    <div
      id="status"
      class="status info">

      กด
      <b>📷 เปิดกล้อง</b>
      เพื่อเริ่มสแกน

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="result">

      <div class="result-label">
        Barcode ที่สแกนได้
      </div>


      <div
        id="resultCode"
        class="result-code">
      </div>

    </div>


    <!-- BUTTONS -->

    <button
      id="openBtn"
      class="open-btn"
      onclick="startCamera()">

      📷 เปิดกล้อง

    </button>


    <button
      id="retryBtn"
      class="retry-btn"
      onclick="restartCamera()">

      🔄 สแกนใหม่

    </button>


    <button
      class="close-btn"
      onclick="closeScanner()">

      ✕ ปิด

    </button>


    <div class="help">

      ระบบจะไม่แสดงรายการเลือกกล้อง<br>
      และจะพยายามเลือกกล้องหลังให้อัตโนมัติ

    </div>


  </div>

</div>


<script>


/* =========================================================
   CONFIG
========================================================= */


/*
  ใส่ URL Web App ของ Apps Script

  ตัวอย่าง:

  https://script.google.com/macros/s/AKfycbxxxx/exec
*/

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzjjsoKDK9ggHZMeXALTA_YLYEQtqYcCvg9KglvY0BQwq8y2TuzCmoeCynM3Dq1l7V5/exec';


/* =========================================================
   GLOBAL
========================================================= */

let scanner = null;

let running = false;

let scanned = false;

let sessionId = '';

let sending = false;


/* =========================================================
   ELEMENTS
========================================================= */

const readerEl =
  document.getElementById(
    'reader'
  );


const statusEl =
  document.getElementById(
    'status'
  );


const resultEl =
  document.getElementById(
    'result'
  );


const resultCodeEl =
  document.getElementById(
    'resultCode'
  );


const openBtn =
  document.getElementById(
    'openBtn'
  );


const retryBtn =
  document.getElementById(
    'retryBtn'
  );


/* =========================================================
   GET SESSION
========================================================= */

function getSessionId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return String(
    params.get(
      'session'
    ) || ''
  ).trim();

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type = 'info'
){

  statusEl.innerHTML =
    message;

  statusEl.className =
    'status ' +
    type;

}


/* =========================================================
   CHECK CONFIG
========================================================= */

function checkConfig(){

  sessionId =
    getSessionId();


  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Scan Session',
      'error'
    );

    return false;

  }


  if(
    !SCRIPT_URL ||
    SCRIPT_URL.includes(
      'ใส่_DEPLOYMENT_ID'
    )
  ){

    setStatus(
      '❌ ยังไม่ได้ใส่ URL Apps Script',
      'error'
    );

    return false;

  }


  return true;

}


/* =========================================================
   FIND REAR CAMERA
========================================================= */

function findRearCamera(
  cameras
){

  if(
    !cameras ||
    !cameras.length
  ){

    return null;

  }


  /*
    คำที่มักพบในชื่อกล้องหลัง
  */

  const keywords = [

    'back',

    'rear',

    'environment',

    'facing back',

    'หลัง',

    'ด้านหลัง',

    'main',

    'wide',

    'ultra wide'

  ];


  /*
    พยายามหาจากชื่อก่อน
  */

  for(
    const camera
    of cameras
  ){

    const label =
      String(
        camera.label ||
        ''
      ).toLowerCase();


    for(
      const keyword
      of keywords
    ){

      if(
        label.includes(
          keyword.toLowerCase()
        )
      ){

        return camera;

      }

    }

  }


  /*
    ถ้า Browser ไม่เปิดเผยชื่อกล้อง
    มักจะมีหลาย videoinput

    เราไม่แสดงให้ผู้ใช้เลือก
    แต่เลือกตัวสุดท้ายให้เอง
  */

  if(
    cameras.length > 1
  ){

    return cameras[
      cameras.length - 1
    ];

  }


  /*
    มีเพียงกล้องเดียว
  */

  return cameras[0];

}


/* =========================================================
   GET CAMERA LIST
========================================================= */

async function getCameraList(){

  /*
    ขั้นแรก:
    ขอสิทธิ์กล้องแบบไม่กำหนด facingMode
  */

  let stream = null;


  try{

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:true,

          audio:false

        });

  }
  catch(error){

    throw error;

  }


  /*
    ได้สิทธิ์แล้ว
    ปิด stream ทดสอบ
  */

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  /*
    ตอนนี้ Browser จะมีสิทธิ์เปิดเผย
    รายชื่อกล้องมากขึ้น
  */

  const devices =
    await navigator.mediaDevices
      .enumerateDevices();


  const cameras =
    devices.filter(
      function(device){

        return (
          device.kind ===
          'videoinput'
        );

      }
    );


  return cameras;

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera(){

  if(running){

    return;

  }


  if(
    !checkConfig()
  ){

    return;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    setStatus(
      '❌ Browser นี้ไม่รองรับกล้อง',
      'error'
    );

    return;

  }


  scanned =
    false;

  sending =
    false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  retryBtn.style.display =
    'none';


  openBtn.style.display =
    'none';


  setStatus(
    'กำลังขอสิทธิ์ใช้กล้อง...',
    'info'
  );


  /* =======================================================
     GET CAMERAS
  ======================================================= */

  let cameras = [];


  try{

    cameras =
      await getCameraList();

  }
  catch(error){

    console.error(
      'Camera permission error:',
      error
    );


    let message =
      '❌ ไม่สามารถเข้าถึงกล้องได้';


    if(
      error &&
      error.name ===
      'NotAllowedError'
    ){

      message +=
        '<br>กรุณาอนุญาตการใช้กล้อง';

    }

    else if(
      error &&
      error.name ===
      'NotFoundError'
    ){

      message +=
        '<br>ไม่พบกล้องบนอุปกรณ์';

    }

    else if(
      error &&
      error.name ===
      'NotReadableError'
    ){

      message +=
        '<br>กล้องกำลังถูกใช้งานโดยแอปอื่น';

    }

    else{

      message +=
        '<br>Error: ' +
        (
          error?.name ||
          'Unknown'
        );

    }


    setStatus(
      message,
      'error'
    );


    openBtn.style.display =
      'block';


    retryBtn.style.display =
      'block';


    return;

  }


  /* =======================================================
     NO CAMERA
  ======================================================= */

  if(
    !cameras.length
  ){

    setStatus(
      '❌ ไม่พบกล้องบนอุปกรณ์',
      'error'
    );


    openBtn.style.display =
      'block';


    retryBtn.style.display =
      'block';


    return;

  }


  /* =======================================================
     SELECT REAR AUTOMATICALLY
  ======================================================= */

  const rearCamera =
    findRearCamera(
      cameras
    );


  if(!rearCamera){

    setStatus(
      '❌ ไม่สามารถหากล้องสำหรับสแกนได้',
      'error'
    );


    openBtn.style.display =
      'block';


    return;

  }


  console.log(
    'Camera selected:',
    rearCamera
  );


  setStatus(
    '📷 กำลังเปิดกล้อง...',
    'info'
  );


  /* =======================================================
     CREATE SCANNER
  ======================================================= */

  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );

  }
  catch(error){

    console.error(
      error
    );


    scanner =
      null;


    setStatus(
      '❌ ไม่สามารถสร้าง Scanner ได้',
      'error'
    );


    openBtn.style.display =
      'block';


    return;

  }


  /* =======================================================
     START BY CAMERA ID

     สำคัญ:
     ไม่ใช้ facingMode
  ======================================================= */

  try{

    running =
      true;


    await scanner.start(

      rearCamera.id,

      {

        fps:10,

        qrbox:{
          width:280,
          height:160
        },

        disableFlip:true

      },

      onScanSuccess,

      onScanError

    );


    setStatus(
      '📷 กล้องหลังพร้อมใช้งาน<br>' +
      'นำ Barcode มาไว้ในกรอบ',
      'success'
    );

  }
  catch(error){

    console.error(
      'Camera start error:',
      error
    );


    running =
      false;


    try{

      if(scanner){

        await scanner.clear();

      }

    }
    catch(e){}


    scanner =
      null;


    setStatus(
      '❌ ไม่สามารถเปิดกล้องหลังได้<br><br>' +
      'กรุณากด "สแกนใหม่"',
      'error'
    );


    openBtn.style.display =
      'block';


    retryBtn.style.display =
      'block';

  }

}


/* =========================================================
   SCAN SUCCESS
========================================================= */

function onScanSuccess(
  decodedText,
  decodedResult
){

  if(
    scanned ||
    sending
  ){

    return;

  }


  const barcode =
    String(
      decodedText || ''
    ).trim();


  if(!barcode){

    return;

  }


  scanned =
    true;


  sending =
    true;


  resultCodeEl.textContent =
    barcode;


  resultEl.style.display =
    'block';


  setStatus(
    '✅ สแกนสำเร็จ<br>' +
    'กำลังส่งข้อมูล...',
    'success'
  );


  stopScanner()
    .then(
      function(){

        return sendBarcodeToApp(
          barcode
        );

      }
    );

}


/* =========================================================
   SCAN ERROR
========================================================= */

function onScanError(){

  /*
    ไม่แสดง error ระหว่างสแกน
  */

}


/* =========================================================
   SEND BARCODE TO APPS SCRIPT
========================================================= */

function sendBarcodeToApp(
  barcode
){

  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Scan Session',
      'error'
    );

    sending =
      false;

    scanned =
      false;

    retryBtn.style.display =
      'block';

    return Promise.resolve();

  }


  const params =
    new URLSearchParams();


  params.set(
    'action',
    'saveScan'
  );


  params.set(
    'session',
    sessionId
  );


  params.set(
    'barcode',
    barcode
  );


  params.set(
    't',
    Date.now()
  );


  const url =
    SCRIPT_URL +
    '?' +
    params.toString();


  console.log(
    'Sending Barcode:',
    barcode
  );


  return new Promise(
    function(resolve){

      /*
        ใช้ Image request
        เพื่อไม่ติดปัญหา CORS
      */

      const img =
        new Image();


      let finished =
        false;


      function finish(){

        if(finished){

          return;

        }


        finished =
          true;


        setStatus(
          '✅ ส่ง Barcode เข้า Apps Script แล้ว<br>' +
          'กำลังกลับหน้าหลัก...',
          'success'
        );


        setTimeout(
          function(){

            closeWindow();


            resolve();

          },
          800
        );

      }


      img.onload =
        finish;


      img.onerror =
        finish;


      img.src =
        url;


      /*
        ป้องกันกรณี Browser
        ไม่ยิง onload / onerror
      */

      setTimeout(
        finish,
        3000
      );

    }
  );

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){

    return;

  }


  const current =
    scanner;


  scanner =
    null;


  running =
    false;


  try{

    await current.stop();

  }
  catch(error){

    console.log(
      'stop error:',
      error
    );

  }


  try{

    current.clear();

  }
  catch(error){}

}


/* =========================================================
   RESTART
========================================================= */

async function restartCamera(){

  await stopScanner();


  scanned =
    false;


  sending =
    false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  setStatus(
    '📷 กำลังเตรียมกล้องหลัง...',
    'info'
  );


  setTimeout(
    function(){

      startCamera();

    },
    300
  );

}


/* =========================================================
   CLOSE
========================================================= */

async function closeScanner(){

  await stopScanner();


  closeWindow();

}


/* =========================================================
   CLOSE WINDOW
========================================================= */

function closeWindow(){

  try{

    window.close();

  }
  catch(e){}


  /*
    ถ้า Browser ไม่ยอมปิด Tab
    ให้กลับหน้าก่อนหน้า
  */

  setTimeout(
    function(){

      if(
        !window.closed
      ){

        history.back();

      }

    },
    300
  );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  'beforeunload',
  function(){

    try{

      if(
        scanner &&
        running
      ){

        scanner
          .stop()
          .catch(
            function(){}
          );

      }

    }
    catch(e){}

  }
);

</script>

</body>

</html>
