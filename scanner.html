<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>สแกน Barcode</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde2e4,
      #e0f4ff
    );

  min-height:100vh;

  padding:10px;

}

.card{

  width:100%;

  max-width:500px;

  margin:0 auto;

  background:#fff;

  border-radius:22px;

  padding:16px;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.15);

}

.title{

  text-align:center;

  color:#4a148c;

  font-size:23px;

  font-weight:900;

  margin-bottom:6px;

}

.subtitle{

  text-align:center;

  color:#666;

  font-size:14px;

  line-height:1.5;

  margin-bottom:14px;

}

#reader{

  width:100%;

  min-height:260px;

  background:#111;

  border-radius:18px;

  overflow:hidden;

}

#reader video{

  width:100% !important;

  height:auto !important;

  display:block;

}

.status{

  margin-top:14px;

  padding:13px;

  border-radius:14px;

  text-align:center;

  font-size:14px;

  line-height:1.6;

}

.info{

  background:#ede7f6;

  color:#4a148c;

}

.success{

  background:#e8f5e9;

  color:#1b5e20;

}

.error{

  background:#ffebee;

  color:#b71c1c;

}

.result{

  display:none;

  margin-top:14px;

  padding:15px;

  border-radius:15px;

  background:#f4effb;

  text-align:center;

}

.result-code{

  margin-top:6px;

  color:#4a148c;

  font-size:25px;

  font-weight:900;

  word-break:break-all;

}

button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:15px;

  font-size:16px;

  font-weight:800;

}

.open-btn{

  background:#4a148c;

  color:#fff;

}

.retry-btn{

  display:none;

  background:#4a148c;

  color:#fff;

}

.close-btn{

  background:#eee;

  color:#555;

}

</style>

</head>


<body>


<div class="card">

  <div class="title">
    📷 สแกน Barcode สินค้า
  </div>

  <div class="subtitle">
    ใช้กล้องมือถือสแกน Barcode บนสินค้า
  </div>

  <div id="reader"></div>

  <div
    id="status"
    class="status info">

    กด
    <b>📷 เปิดกล้อง</b>
    เพื่อเริ่ม

  </div>

  <div
    id="result"
    class="result">

    Barcode ที่สแกนได้

    <div
      id="resultCode"
      class="result-code">
    </div>

  </div>

  <button
    id="openBtn"
    class="open-btn"
    onclick="startScanner()">

    📷 เปิดกล้อง

  </button>

  <button
    id="retryBtn"
    class="retry-btn"
    onclick="restartScanner()">

    🔄 สแกนใหม่

  </button>

  <button
    class="close-btn"
    onclick="closeScanner()">

    ✕ ปิด

  </button>

</div>


<script>


/* =====================================================
   CONFIG
===================================================== */

const SCRIPT_URL =
  'https://script.google.com/macros/s/ใส่_DEPLOYMENT_ID_ของคุณ/exec';


/* =====================================================
   GLOBAL
===================================================== */

let html5QrCode = null;

let scanning = false;

let scanned = false;

let sessionId = '';


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
  document.getElementById(
    'status'
  );

const resultEl =
  document.getElementById(
    'result'
  );

const resultCodeEl =
  document.getElementById(
    'resultCode'
  );

const openBtn =
  document.getElementById(
    'openBtn'
  );

const retryBtn =
  document.getElementById(
    'retryBtn'
  );


/* =====================================================
   SESSION
===================================================== */

function getSession(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return String(
    params.get('session') || ''
  ).trim();

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  type
){

  statusEl.innerHTML =
    message;

  statusEl.className =
    'status ' +
    (type || 'info');

}


/* =====================================================
   START SCANNER
===================================================== */

function startScanner(){

  if(scanning){

    return;

  }


  sessionId =
    getSession();


  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Session',
      'error'
    );

    return;

  }


  scanned =
    false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  openBtn.style.display =
    'none';


  retryBtn.style.display =
    'none';


  setStatus(
    '📷 กำลังเปิดกล้อง...',
    'info'
  );


  /*
    สร้าง Scanner
  */

  try{

    html5QrCode =
      new Html5Qrcode(
        'reader'
      );

  }
  catch(error){

    console.error(
      error
    );


    setStatus(
      '❌ ไม่สามารถสร้าง Scanner ได้',
      'error'
    );


    openBtn.style.display =
      'block';

    return;

  }


  /*
    เปิดกล้องหลังโดยตรง
  */

  scanning =
    true;


  html5QrCode
    .start(

      'environment',

      {

        fps:10,

        qrbox:{
          width:280,
          height:160
        }

      },

      function(decodedText){

        onBarcodeFound(
          decodedText
        );

      },

      function(){

        /*
          ไม่ทำอะไรระหว่างหา Barcode
        */

      }

    )

    .then(
      function(){

        setStatus(
          '📷 กล้องพร้อมใช้งาน<br>' +
          'เอา Barcode มาไว้ในกรอบ',
          'success'
        );

      }
    )

    .catch(
      function(error){

        console.error(
          'Scanner start error:',
          error
        );


        scanning =
          false;


        let errorName =
          '';

        let errorMessage =
          '';


        if(error){

          errorName =
            error.name ||
            '';

          errorMessage =
            error.message ||
            String(error);

        }


        setStatus(

          '❌ ไม่สามารถเปิดกล้องได้' +

          (
            errorName
              ? '<br><br>Error: ' +
                errorName
              : ''
          ) +

          (
            errorMessage
              ? '<br>' +
                errorMessage
              : ''
          ),

          'error'

        );


        openBtn.style.display =
          'block';


        retryBtn.style.display =
          'block';

      }
    );

}


/* =====================================================
   BARCODE FOUND
===================================================== */

function onBarcodeFound(
  barcode
){

  if(scanned){

    return;

  }


  barcode =
    String(
      barcode || ''
    ).trim();


  if(!barcode){

    return;

  }


  scanned =
    true;


  resultCodeEl.textContent =
    barcode;


  resultEl.style.display =
    'block';


  setStatus(
    '✅ สแกนสำเร็จ<br>' +
    'Barcode: ' +
    barcode +
    '<br>' +
    'กำลังส่งข้อมูล...',
    'success'
  );


  stopScanner()
    .then(
      function(){

        sendBarcode(
          barcode
        );

      }
    );

}


/* =====================================================
   SEND BARCODE
===================================================== */

function sendBarcode(
  barcode
){

  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Session',
      'error'
    );

    return;

  }


  const params =
    new URLSearchParams();


  params.set(
    'action',
    'saveScan'
  );


  params.set(
    'session',
    sessionId
  );


  params.set(
    'barcode',
    barcode
  );


  params.set(
    't',
    Date.now()
  );


  const url =
    SCRIPT_URL +
    '?' +
    params.toString();


  console.log(
    'SEND BARCODE:',
    barcode
  );


  /*
    ใช้ Image request
  */

  const img =
    new Image();


  let done =
    false;


  function complete(){

    if(done){

      return;

    }


    done =
      true;


    setStatus(
      '✅ ส่ง Barcode เข้า Apps Script แล้ว<br>' +
      'กำลังกลับหน้าหลัก...',
      'success'
    );


    setTimeout(
      function(){

        closeScannerWindow();

      },
      800
    );

  }


  img.onload =
    complete;


  img.onerror =
    complete;


  img.src =
    url;


  /*
    fallback
  */

  setTimeout(
    complete,
    3000
  );

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner(){

  if(
    !html5QrCode ||
    !scanning
  ){

    return Promise.resolve();

  }


  const scanner =
    html5QrCode;


  html5QrCode =
    null;


  scanning =
    false;


  return scanner
    .stop()

    .catch(
      function(error){

        console.log(
          'Stop scanner:',
          error
        );

      }
    )

    .then(
      function(){

        try{

          scanner.clear();

        }
        catch(e){}

      }
    );

}


/* =====================================================
   RESTART
===================================================== */

async function restartScanner(){

  await stopScanner();


  scanned =
    false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  setStatus(
    '📷 กำลังเปิดกล้อง...',
    'info'
  );


  setTimeout(
    function(){

      startScanner();

    },
    300
  );

}


/* =====================================================
   CLOSE
===================================================== */

async function closeScanner(){

  await stopScanner();


  closeScannerWindow();

}


/* =====================================================
   CLOSE WINDOW
===================================================== */

function closeScannerWindow(){

  try{

    window.close();

  }
  catch(e){}


  setTimeout(
    function(){

      if(
        !window.closed
      ){

        history.back();

      }

    },
    300
  );

}

</script>

</body>

</html>
