<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>สแกน Barcode สินค้า</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde2e4,
      #e0f4ff
    );

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:flex-start;

  padding:12px;

}

.container{

  width:100%;

  max-width:500px;

  margin-top:5px;

}

.card{

  width:100%;

  background:#fff;

  border-radius:22px;

  padding:16px;

  box-shadow:
    0 10px 28px
    rgba(0,0,0,.16);

}

.title{

  text-align:center;

  font-size:23px;

  font-weight:900;

  color:#4a148c;

  margin-bottom:5px;

}

.subtitle{

  text-align:center;

  color:#666;

  font-size:14px;

  line-height:1.5;

  margin-bottom:14px;

}

#reader{

  width:100%;

  min-height:260px;

  overflow:hidden;

  border-radius:18px;

  background:#111;

}

#reader video{

  width:100% !important;

  height:auto !important;

  display:block;

  border-radius:18px;

}

.status{

  margin-top:14px;

  padding:12px 14px;

  border-radius:14px;

  text-align:center;

  font-size:14px;

  line-height:1.6;

}

.status.info{

  background:#ede7f6;

  color:#4a148c;

}

.status.success{

  background:#e8f5e9;

  color:#1b5e20;

}

.status.error{

  background:#ffebee;

  color:#b71c1c;

}

.result{

  display:none;

  margin-top:14px;

  padding:16px;

  border-radius:16px;

  background:#f4effb;

  text-align:center;

}

.result-label{

  color:#666;

  font-size:13px;

  margin-bottom:6px;

}

.result-code{

  color:#4a148c;

  font-size:25px;

  line-height:1.3;

  font-weight:900;

  word-break:break-all;

}

button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:15px;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

}

.open-btn{

  background:#4a148c;

  color:#fff;

}

.retry-btn{

  display:none;

  background:#4a148c;

  color:#fff;

}

.close-btn{

  background:#eee;

  color:#555;

}

.help{

  margin-top:14px;

  padding:12px;

  border-radius:14px;

  background:#fafafa;

  color:#666;

  font-size:13px;

  line-height:1.6;

  text-align:center;

}

</style>

</head>


<body>


<div class="container">

  <div class="card">


    <div class="title">
      📷 สแกน Barcode สินค้า
    </div>


    <div class="subtitle">
      ระบบจะใช้เฉพาะกล้องหลังมือถือ
    </div>


    <div id="reader"></div>


    <div
      id="status"
      class="status info">

      กด
      <b>📷 เปิดกล้อง</b>
      เพื่อเริ่มสแกน

    </div>


    <div
      id="result"
      class="result">

      <div class="result-label">
        Barcode ที่สแกนได้
      </div>

      <div
        id="resultCode"
        class="result-code">
      </div>

    </div>


    <button
      id="openBtn"
      class="open-btn"
      onclick="startCamera()">

      📷 เปิดกล้อง

    </button>


    <button
      id="retryBtn"
      class="retry-btn"
      onclick="restartScanner()">

      🔄 สแกนใหม่

    </button>


    <button
      class="close-btn"
      onclick="closeScanner()">

      ✕ ปิดหน้าสแกน

    </button>


    <div class="help">

      ระบบเลือกใช้กล้องหลังอัตโนมัติ<br>
      ไม่มีรายการให้เลือกกล้อง

    </div>


  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycby8Gizou10murE7uFHv9_3vB7q0Dpy5M-HkjhtHwYRENITNXvrLaAwX2TNOHJArKPem/exec';


/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let running = false;

let scanned = false;

let sessionId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
  document.getElementById(
    'status'
  );

const resultEl =
  document.getElementById(
    'result'
  );

const resultCodeEl =
  document.getElementById(
    'resultCode'
  );

const openBtn =
  document.getElementById(
    'openBtn'
  );

const retryBtn =
  document.getElementById(
    'retryBtn'
  );


/* =====================================================
   SESSION
===================================================== */

function getSessionId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return String(
    params.get(
      'session'
    ) || ''
  ).trim();

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  type = 'info'
){

  statusEl.innerHTML =
    message;

  statusEl.className =
    'status ' +
    type;

}


/* =====================================================
   FIND REAR CAMERA
===================================================== */

function findRearCamera(
  cameras
){

  if(
    !cameras ||
    !cameras.length
  ){

    return null;

  }


  /*
    หลังจาก Browser
    ได้สิทธิ์กล้องแล้ว
    label ของกล้องมักจะถูกเปิดเผย
  */

  const rearKeywords = [

    'back',

    'rear',

    'environment',

    'facing back',

    'camera 0',

    'camera 1',

    'หลัง',

    'ด้านหลัง'

  ];


  /*
    หาจากชื่อกล้องก่อน
  */

  for(
    const camera
    of cameras
  ){

    const label =
      String(
        camera.label ||
        ''
      ).toLowerCase();


    for(
      const keyword
      of rearKeywords
    ){

      if(
        label.includes(
          keyword.toLowerCase()
        )
      ){

        return camera;

      }

    }

  }


  /*
    ถ้าหาชื่อไม่เจอ
    ให้ใช้กล้องตัวแรก

    หมายเหตุ:
    Browser บางรุ่นไม่เปิดเผย label
    จนกว่าจะได้รับ permission
  */

  return cameras[0];

}


/* =====================================================
   GET CAMERAS
===================================================== */

async function getCameraList(){

  /*
    ขอสิทธิ์กล้องแบบไม่บังคับ
    facingMode
  */

  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:true,

          audio:false

        });


    /*
      ได้ permission แล้ว
      ปิด test stream
    */

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );


    /*
      ตอนนี้ Browser มักจะเปิดเผย
      รายชื่อกล้อง
    */

    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    const cameras =
      devices.filter(
        function(device){

          return (
            device.kind ===
            'videoinput'
          );

        }
      );


    return cameras;

  }
  catch(error){

    throw error;

  }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  if(running){

    return;

  }


  sessionId =
    getSessionId();


  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Scan Session',
      'error'
    );

    return;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    setStatus(
      '❌ Browser ไม่รองรับกล้อง',
      'error'
    );

    return;

  }


  scanned = false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  retryBtn.style.display =
    'none';


  openBtn.style.display =
    'none';


  setStatus(
    'กำลังเปิดกล้องหลัง...',
    'info'
  );


  /* ===================================================
     CHECK HTTPS
  =================================================== */

  if(
    location.protocol !==
    'https:'
  ){

    setStatus(
      '❌ Scanner ต้องเปิดผ่าน HTTPS',
      'error'
    );

    openBtn.style.display =
      'block';

    return;

  }


  /* ===================================================
     CHECK LIBRARY
  =================================================== */

  if(
    typeof Html5Qrcode ===
    'undefined'
  ){

    setStatus(
      '❌ โหลดระบบ Barcode Scanner ไม่สำเร็จ',
      'error'
    );

    openBtn.style.display =
      'block';

    return;

  }


  /* ===================================================
     REQUEST PERMISSION
  =================================================== */

  let cameras = [];


  try{

    cameras =
      await getCameraList();

  }
  catch(error){

    console.error(
      'Camera permission error:',
      error
    );


    let message =
      '❌ ไม่สามารถเข้าถึงกล้องได้';


    if(
      error &&
      error.name ===
      'NotAllowedError'
    ){

      message +=
        '<br>กรุณาอนุญาตการใช้กล้อง';

    }
    else if(
      error &&
      error.name ===
      'NotFoundError'
    ){

      message +=
        '<br>ไม่พบกล้องบนอุปกรณ์';

    }
    else if(
      error &&
      error.name ===
      'NotReadableError'
    ){

      message +=
        '<br>กล้องกำลังถูกใช้งานโดยแอปอื่น';

    }
    else{

      message +=
        '<br>Error: ' +
        (
          error?.name ||
          'Unknown'
        );

    }


    setStatus(
      message,
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';


    return;

  }


  /* ===================================================
     NO CAMERA
  =================================================== */

  if(
    !cameras.length
  ){

    setStatus(
      '❌ ไม่พบกล้องหลังบนอุปกรณ์',
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';


    return;

  }


  /* ===================================================
     FIND REAR CAMERA
  =================================================== */

  const rearCamera =
    findRearCamera(
      cameras
    );


  if(!rearCamera){

    setStatus(
      '❌ ไม่พบกล้องหลัง',
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';


    return;

  }


  console.log(
    'Using camera:',
    rearCamera
  );


  /* ===================================================
     CREATE SCANNER
  =================================================== */

  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );

  }
  catch(error){

    console.error(
      error
    );


    scanner =
      null;


    setStatus(
      '❌ สร้าง Scanner ไม่สำเร็จ',
      'error'
    );


    openBtn.style.display =
      'block';


    return;

  }


  /* ===================================================
     START REAR CAMERA
  =================================================== */

  try{

    running =
      true;


    await scanner.start(

      rearCamera.id,

      {

        fps:10,

        qrbox:{
          width:280,
          height:160
        },

        aspectRatio:1.777

      },

      onScanSuccess,

      onScanError

    );


    setStatus(
      '📷 กล้องหลังพร้อมใช้งาน<br>' +
      'นำ Barcode มาไว้ในกรอบ',
      'success'
    );

  }
  catch(error){

    console.error(
      'Rear camera start error:',
      error
    );


    running =
      false;


    try{

      scanner.clear();

    }
    catch(e){}


    scanner =
      null;


    setStatus(
      '❌ ไม่สามารถเปิดกล้องหลังได้<br><br>' +
      'กรุณาลองเปิดกล้องใหม่',
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';

  }

}


/* =====================================================
   SCAN SUCCESS
===================================================== */

function onScanSuccess(
  decodedText
){

  if(scanned){

    return;

  }


  const barcode =
    String(
      decodedText || ''
    ).trim();


  if(!barcode){

    return;

  }


  scanned =
    true;


  resultCodeEl.textContent =
    barcode;


  resultEl.style.display =
    'block';


  setStatus(
    '✅ สแกนสำเร็จ<br>' +
    'กำลังส่งข้อมูล...',
    'success'
  );


  stopScanner()
    .then(
      function(){

        sendBarcodeToApp(
          barcode
        );

      }
    );

}


/* =====================================================
   SCAN ERROR
===================================================== */

function onScanError(){

  /*
    ไม่แสดง Error ทุก Frame
  */

}


/* =====================================================
   SEND BARCODE
===================================================== */

function sendBarcodeToApp(
  barcode
){

  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Scan Session',
      'error'
    );

    retryBtn.style.display =
      'block';

    return;

  }


  const params =
    new URLSearchParams();


  params.set(
    'action',
    'saveScan'
  );


  params.set(
    'session',
    sessionId
  );


  params.set(
    'barcode',
    barcode
  );


  params.set(
    't',
    Date.now()
  );


  const url =
    SCRIPT_URL +
    '?' +
    params.toString();


  console.log(
    'Sending Barcode:',
    barcode
  );


  /*
    ใช้ Image Beacon
    เพื่อไม่ต้องพึ่ง CORS
  */

  const img =
    new Image();


  let done =
    false;


  function finish(){

    if(done){

      return;

    }


    done =
      true;


    setStatus(
      '✅ ส่ง Barcode กลับระบบแล้ว<br>' +
      'กำลังกลับหน้าหลัก...',
      'success'
    );


    setTimeout(
      function(){

        closeWindow();

      },
      800
    );

  }


  img.onload =
    finish;


  img.onerror =
    finish;


  img.src =
    url;


  /*
    เผื่อ Browser
    ไม่ส่ง event
  */

  setTimeout(
    finish,
    3000
  );

}


/* =====================================================
   STOP CAMERA
===================================================== */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){

    return;

  }


  const currentScanner =
    scanner;


  scanner =
    null;


  running =
    false;


  try{

    await currentScanner.stop();

  }
  catch(error){

    console.log(
      'Stop scanner error:',
      error
    );

  }


  try{

    currentScanner.clear();

  }
  catch(error){}

}


/* =====================================================
   RETRY
===================================================== */

async function restartScanner(){

  await stopScanner();


  scanned =
    false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  setStatus(
    'กำลังเตรียมกล้องหลัง...',
    'info'
  );


  setTimeout(
    function(){

      startCamera();

    },
    300
  );

}


/* =====================================================
   CLOSE
===================================================== */

async function closeScanner(){

  await stopScanner();


  /*
    ยกเลิก Session
  */

  if(
    SCRIPT_URL &&
    sessionId
  ){

    const params =
      new URLSearchParams();


    params.set(
      'action',
      'cancelScan'
    );


    params.set(
      'session',
      sessionId
    );


    params.set(
      't',
      Date.now()
    );


    const img =
      new Image();


    img.src =
      SCRIPT_URL +
      '?' +
      params.toString();

  }


  closeWindow();

}


/* =====================================================
   CLOSE WINDOW
===================================================== */

function closeWindow(){

  try{

    window.close();

  }
  catch(e){}


  setTimeout(
    function(){

      if(
        !window.closed
      ){

        history.back();

      }

    },
    300
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

</script>

</body>

</html>
