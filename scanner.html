<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>สแกน Barcode สินค้า</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:10px;
  min-height:100vh;

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde2e4,
      #e0f4ff
    );
}

.card{
  width:100%;
  max-width:500px;
  margin:auto;

  padding:15px;

  background:#fff;

  border-radius:22px;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.15);
}

.title{
  text-align:center;

  color:#4a148c;

  font-size:22px;

  font-weight:900;

  margin-bottom:5px;
}

.subtitle{
  text-align:center;

  color:#666;

  font-size:14px;

  margin-bottom:15px;
}

#reader{
  width:100%;

  min-height:250px;

  background:#111;

  border-radius:18px;

  overflow:hidden;
}

#reader video{
  width:100% !important;
  height:auto !important;
  display:block;
}

.status{
  margin-top:12px;
  padding:12px;

  border-radius:14px;

  text-align:center;

  font-size:14px;

  line-height:1.6;
}

.info{
  background:#ede7f6;
  color:#4a148c;
}

.success{
  background:#e8f5e9;
  color:#1b5e20;
}

.error{
  background:#ffebee;
  color:#b71c1c;
}

.result{
  display:none;

  margin-top:12px;

  padding:15px;

  border-radius:15px;

  background:#f4effb;

  text-align:center;
}

.result-code{
  margin-top:5px;

  color:#4a148c;

  font-size:24px;

  font-weight:900;

  word-break:break-all;
}

button{
  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:15px;

  font-size:16px;

  font-weight:800;
}

.open-btn{
  background:#4a148c;
  color:#fff;
}

.retry-btn{
  display:none;

  background:#4a148c;
  color:#fff;
}

.close-btn{
  background:#eee;
  color:#555;
}

</style>

</head>

<body>

<div class="card">

  <div class="title">
    📷 สแกน Barcode สินค้า
  </div>

  <div class="subtitle">
    ระบบจะใช้กล้องหลังมือถือ
  </div>

  <div id="reader"></div>

  <div
    id="status"
    class="status info">

    กด
    <b>📷 เปิดกล้อง</b>
    เพื่อเริ่มสแกน

  </div>

  <div
    id="result"
    class="result">

    Barcode ที่สแกนได้

    <div
      id="resultCode"
      class="result-code">
    </div>

  </div>

  <button
    id="openBtn"
    class="open-btn"
    onclick="startCamera()">

    📷 เปิดกล้อง

  </button>

  <button
    id="retryBtn"
    class="retry-btn"
    onclick="restartCamera()">

    🔄 ลองใหม่

  </button>

  <button
    class="close-btn"
    onclick="closeScanner()">

    ✕ ปิด

  </button>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

/*
  ใส่ URL Web App ของ Google Apps Script
*/

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycby8Gizou10murE7uFHv9_3vB7q0Dpy5M-HkjhtHwYRENITNXvrLaAwX2TNOHJArKPem/exec';


/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let running = false;

let scanned = false;

let sessionId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
  document.getElementById('status');

const resultEl =
  document.getElementById('result');

const resultCodeEl =
  document.getElementById('resultCode');

const openBtn =
  document.getElementById('openBtn');

const retryBtn =
  document.getElementById('retryBtn');


/* =====================================================
   SESSION
===================================================== */

function getSessionId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return String(
    params.get('session') || ''
  ).trim();

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  type='info'
){

  statusEl.innerHTML = text;

  statusEl.className =
    'status ' + type;

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  if(running){

    return;

  }


  sessionId =
    getSessionId();


  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Scan Session',
      'error'
    );

    return;

  }


  scanned = false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  openBtn.style.display =
    'none';


  retryBtn.style.display =
    'none';


  setStatus(
    '📷 กำลังเปิดกล้องหลัง...',
    'info'
  );


  /* =================================================
     HTTPS
  ================================================= */

  if(
    location.protocol !==
    'https:'
  ){

    setStatus(
      '❌ หน้านี้ต้องเปิดผ่าน HTTPS',
      'error'
    );

    openBtn.style.display =
      'block';

    return;

  }


  /* =================================================
     CREATE SCANNER
  ================================================= */

  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );

  }
  catch(error){

    console.error(error);

    scanner = null;

    setStatus(
      '❌ สร้าง Scanner ไม่สำเร็จ',
      'error'
    );

    openBtn.style.display =
      'block';

    return;

  }


  /* =================================================
     OPEN REAR CAMERA
     
     สำคัญ:
     ใช้ exact ตามรูปแบบที่ library รองรับ
  ================================================= */

  try{

    running = true;


    await scanner.start(

      {
        facingMode: {
          exact: 'environment'
        }
      },

      {
        fps:10,

        qrbox:{
          width:280,
          height:160
        }

      },

      onScanSuccess,

      onScanError

    );


    setStatus(
      '📷 กล้องหลังพร้อมใช้งาน<br>' +
      'นำ Barcode มาไว้ในกรอบ',
      'success'
    );

  }

  catch(error){

    console.error(
      'Camera ERROR:',
      error
    );


    running = false;


    try{

      scanner.clear();

    }
    catch(e){}


    scanner = null;


    /*
      แสดง Error จริง
      เพื่อไม่ให้ต้องเดา
    */

    let message =
      '❌ ไม่สามารถเปิดกล้องหลังได้';


    if(
      error &&
      error.name
    ){

      message +=
        '<br><br>' +
        'Error: ' +
        error.name;

    }


    if(
      error &&
      error.message
    ){

      message +=
        '<br>' +
        error.message;

    }


    setStatus(
      message,
      'error'
    );


    openBtn.style.display =
      'block';


    retryBtn.style.display =
      'block';

  }

}


/* =====================================================
   SCAN SUCCESS
===================================================== */

function onScanSuccess(
  decodedText
){

  if(scanned){

    return;

  }


  const barcode =
    String(
      decodedText || ''
    ).trim();


  if(!barcode){

    return;

  }


  scanned = true;


  resultCodeEl.textContent =
    barcode;


  resultEl.style.display =
    'block';


  setStatus(
    '✅ สแกนสำเร็จ<br>' +
    'กำลังส่งข้อมูล...',
    'success'
  );


  stopScanner()
    .then(
      function(){

        sendBarcode(
          barcode
        );

      }
    );

}


/* =====================================================
   SCAN ERROR
===================================================== */

function onScanError(){

  /*
    ไม่แสดง error
    ทุก frame
  */

}


/* =====================================================
   SEND BARCODE TO APPS SCRIPT
===================================================== */

function sendBarcode(
  barcode
){

  if(!sessionId){

    setStatus(
      '❌ ไม่พบ Session ID',
      'error'
    );

    retryBtn.style.display =
      'block';

    return;

  }


  const params =
    new URLSearchParams();


  params.set(
    'action',
    'saveScan'
  );


  params.set(
    'session',
    sessionId
  );


  params.set(
    'barcode',
    barcode
  );


  params.set(
    't',
    Date.now()
  );


  const url =
    SCRIPT_URL +
    '?' +
    params.toString();


  console.log(
    'Sending:',
    url
  );


  /*
    ใช้ Image Beacon
    ไม่ต้องพึ่ง CORS
  */

  const img =
    new Image();


  let finished =
    false;


  function finish(){

    if(finished){

      return;

    }


    finished = true;


    setStatus(
      '✅ ส่ง Barcode กลับระบบแล้ว<br>' +
      'กำลังกลับหน้าหลัก...',
      'success'
    );


    setTimeout(
      function(){

        closeWindow();

      },
      800
    );

  }


  img.onload =
    finish;


  img.onerror =
    finish;


  img.src =
    url;


  /*
    fallback
  */

  setTimeout(
    finish,
    3000
  );

}


/* =====================================================
   STOP
===================================================== */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){

    return;

  }


  const current =
    scanner;


  scanner = null;

  running = false;


  try{

    await current.stop();

  }
  catch(e){

    console.log(
      e
    );

  }


  try{

    current.clear();

  }
  catch(e){}

}


/* =====================================================
   RESTART
===================================================== */

async function restartCamera(){

  await stopScanner();


  scanned = false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  setStatus(
    '📷 กำลังเปิดกล้องหลัง...',
    'info'
  );


  setTimeout(
    function(){

      startCamera();

    },
    300
  );

}


/* =====================================================
   CLOSE
===================================================== */

async function closeScanner(){

  await stopScanner();


  /*
    ไม่จำเป็นต้องส่ง cancel
    เพราะ Session มีอายุจำกัด
  */

  closeWindow();

}


/* =====================================================
   CLOSE WINDOW
===================================================== */

function closeWindow(){

  try{

    window.close();

  }
  catch(e){}


  setTimeout(
    function(){

      if(
        !window.closed
      ){

        history.back();

      }

    },
    300
  );

}

</script>

</body>

</html>
