<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>สแกน Barcode สินค้า</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde2e4,
      #e0f4ff
    );

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:flex-start;

  padding:12px;

}


.container{

  width:100%;

  max-width:500px;

  margin-top:5px;

}


.card{

  width:100%;

  background:#fff;

  border-radius:22px;

  padding:16px;

  box-shadow:
    0 10px 28px
    rgba(0,0,0,.16);

}


.title{

  text-align:center;

  font-size:23px;

  font-weight:900;

  color:#4a148c;

  margin-bottom:5px;

}


.subtitle{

  text-align:center;

  color:#666;

  font-size:14px;

  line-height:1.5;

  margin-bottom:14px;

}


#reader{

  width:100%;

  min-height:260px;

  overflow:hidden;

  border-radius:18px;

  background:#111;

}


#reader video{

  width:100% !important;

  height:auto !important;

  display:block;

  border-radius:18px;

}


.status{

  margin-top:14px;

  padding:12px 14px;

  border-radius:14px;

  text-align:center;

  font-size:14px;

  line-height:1.6;

}


.status.info{

  background:#ede7f6;

  color:#4a148c;

}


.status.success{

  background:#e8f5e9;

  color:#1b5e20;

}


.status.error{

  background:#ffebee;

  color:#b71c1c;

}


.result{

  display:none;

  margin-top:14px;

  padding:16px;

  border-radius:16px;

  background:#f4effb;

  text-align:center;

}


.result-label{

  color:#666;

  font-size:13px;

  margin-bottom:6px;

}


.result-code{

  color:#4a148c;

  font-size:25px;

  line-height:1.3;

  font-weight:900;

  word-break:break-all;

}


.camera-select{

  width:100%;

  padding:13px;

  margin-top:12px;

  border:none;

  border-radius:14px;

  background:#f7f7f7;

  font-size:15px;

  display:none;

}


button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:15px;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

}


.open-btn{

  background:#4a148c;

  color:#fff;

}


.retry-btn{

  display:none;

  background:#4a148c;

  color:#fff;

}


.close-btn{

  background:#eee;

  color:#555;

}


.help{

  margin-top:14px;

  padding:12px;

  border-radius:14px;

  background:#fafafa;

  color:#666;

  font-size:13px;

  line-height:1.6;

  text-align:center;

}


@media(max-width:600px){

  body{
    padding:8px;
  }

  .card{
    padding:13px;
    border-radius:20px;
  }

  .title{
    font-size:21px;
  }

  #reader{
    min-height:240px;
  }

}

</style>

</head>


<body>


<div class="container">

  <div class="card">


    <div class="title">

      📷 สแกน Barcode สินค้า

    </div>


    <div class="subtitle">

      หันกล้องมือถือไปที่ Barcode<br>

      เช่น 8850051034149

    </div>


    <div id="reader"></div>


    <div
      id="status"
      class="status info">

      กด
      <b>📷 เปิดกล้อง</b>
      เพื่อเริ่มสแกน

    </div>


    <select
      id="cameraSelect"
      class="camera-select">
    </select>


    <div
      id="result"
      class="result">

      <div class="result-label">

        Barcode ที่สแกนได้

      </div>


      <div
        id="resultCode"
        class="result-code">
      </div>

    </div>


    <button
      id="openBtn"
      class="open-btn"
      onclick="startCamera()">

      📷 เปิดกล้อง

    </button>


    <button
      id="retryBtn"
      class="retry-btn"
      onclick="restartScanner()">

      🔄 สแกนใหม่

    </button>


    <button
      class="close-btn"
      onclick="closeScanner()">

      ✕ ปิดหน้าสแกน

    </button>


    <div class="help">

      ระบบจะพยายามใช้กล้องหลังมือถือก่อน<br>

      เมื่อสแกนสำเร็จ Barcode จะถูกส่งกลับ
      ไปยังหน้าระบบหลัก

    </div>


  </div>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let running = false;

let scanned = false;


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
  document.getElementById('status');

const resultEl =
  document.getElementById('result');

const resultCodeEl =
  document.getElementById('resultCode');

const openBtn =
  document.getElementById('openBtn');

const retryBtn =
  document.getElementById('retryBtn');

const cameraSelect =
  document.getElementById('cameraSelect');


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  type = 'info'
){

  statusEl.innerHTML =
    message;

  statusEl.className =
    'status ' + type;

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  if(running){
    return;
  }


  scanned = false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  retryBtn.style.display =
    'none';


  cameraSelect.style.display =
    'none';


  openBtn.style.display =
    'none';


  setStatus(
    'กำลังตรวจสอบกล้อง...',
    'info'
  );


  /* ===================================================
     HTTPS
  =================================================== */

  if(
    location.protocol !== 'https:' &&
    location.hostname !== 'localhost'
  ){

    setStatus(
      '❌ หน้านี้ไม่ได้เปิดผ่าน HTTPS',
      'error'
    );

    openBtn.style.display =
      'block';

    return;

  }


  /* ===================================================
     LIBRARY
  =================================================== */

  if(
    typeof Html5Qrcode ===
    'undefined'
  ){

    setStatus(
      '❌ โหลดระบบ Scanner ไม่สำเร็จ',
      'error'
    );

    openBtn.style.display =
      'block';

    return;

  }


  /* ===================================================
     CREATE SCANNER
  =================================================== */

  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );

  }
  catch(error){

    console.error(error);

    scanner = null;

    setStatus(
      '❌ ไม่สามารถสร้าง Scanner ได้',
      'error'
    );

    openBtn.style.display =
      'block';

    return;

  }


  /* ===================================================
     TRY ENVIRONMENT CAMERA
  =================================================== */

  setStatus(
    '📷 กำลังเปิดกล้องหลัง...',
    'info'
  );


  try{

    running = true;


    await scanner.start(

      'environment',

      {
        fps:10,

        qrbox:{
          width:280,
          height:160
        },

        aspectRatio:1.777
      },

      onScanSuccess,

      onScanError

    );


    setStatus(
      '📷 กล้องพร้อมใช้งาน<br>' +
      'นำ Barcode มาไว้ในกรอบ',
      'success'
    );


    return;

  }
  catch(error){

    console.warn(
      'Environment camera failed:',
      error
    );


    running = false;

  }


  /* ===================================================
     FALLBACK TO CAMERA LIST
  =================================================== */

  setStatus(
    'กำลังค้นหารายการกล้อง...',
    'info'
  );


  try{

    const cameras =
      await Html5Qrcode.getCameras();


    if(
      !cameras ||
      cameras.length === 0
    ){

      throw new Error(
        'ไม่พบกล้อง'
      );

    }


    fillCameraList(
      cameras
    );


    cameraSelect.style.display =
      'block';


    setStatus(
      'พบกล้องแล้ว<br>' +
      'กรุณาเลือกกล้อง',
      'info'
    );


    if(
      cameras.length === 1
    ){

      cameraSelect.value =
        cameras[0].id;


      await startWithCameraId(
        cameras[0].id
      );

    }

  }
  catch(error){

    console.error(
      'Get cameras error:',
      error
    );


    running = false;

    scanner = null;


    setStatus(
      '❌ ไม่สามารถเข้าถึงกล้องได้<br><br>' +
      'กรุณาตรวจสอบสิทธิ์ Camera',
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';

  }

}


/* =====================================================
   CAMERA LIST
===================================================== */

function fillCameraList(
  cameras
){

  cameraSelect.innerHTML =
    '';


  cameras.forEach(
    function(
      camera,
      index
    ){

      const option =
        document.createElement(
          'option'
        );


      option.value =
        camera.id;


      option.textContent =
        camera.label ||
        (
          'กล้อง ' +
          (
            index + 1
          )
        );


      cameraSelect.appendChild(
        option
      );

    }
  );


  cameraSelect.onchange =
    async function(){

      const cameraId =
        this.value;


      if(!cameraId){
        return;
      }


      await restartWithCameraId(
        cameraId
      );

    };

}


/* =====================================================
   START CAMERA ID
===================================================== */

async function startWithCameraId(
  cameraId
){

  if(!cameraId){
    return;
  }


  try{

    if(!scanner){

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }


    running = true;


    await scanner.start(

      cameraId,

      {
        fps:10,

        qrbox:{
          width:280,
          height:160
        }

      },

      onScanSuccess,

      onScanError

    );


    setStatus(
      '📷 กล้องพร้อมใช้งาน<br>' +
      'นำ Barcode มาไว้ในกรอบ',
      'success'
    );

  }
  catch(error){

    console.error(
      'Camera ID error:',
      error
    );


    running = false;


    setStatus(
      '❌ เปิดกล้องนี้ไม่สำเร็จ<br>' +
      'ลองเลือกกล้องอื่น',
      'error'
    );


    retryBtn.style.display =
      'block';

  }

}


/* =====================================================
   RESTART CAMERA ID
===================================================== */

async function restartWithCameraId(
  cameraId
){

  await stopScanner();


  setTimeout(
    function(){

      startWithCameraId(
        cameraId
      );

    },
    300
  );

}


/* =====================================================
   SCAN SUCCESS
===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
){

  if(scanned){
    return;
  }


  const barcode =
    String(
      decodedText || ''
    ).trim();


  if(!barcode){
    return;
  }


  scanned = true;


  resultCodeEl.textContent =
    barcode;


  resultEl.style.display =
    'block';


  setStatus(
    '✅ สแกน Barcode สำเร็จ',
    'success'
  );


  stopScanner()
    .finally(
      function(){

        sendBarcodeToParent(
          barcode
        );

      }
    );

}


/* =====================================================
   SCAN ERROR
===================================================== */

function onScanError(){
  /*
    ไม่แสดง error ระหว่าง scanning
  */
}


/* =====================================================
   SEND BARCODE
===================================================== */

function sendBarcodeToParent(
  barcode
){

  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(

        {
          type:
            'BARCODE_SCANNED',

          barcode:
            barcode
        },

        '*'

      );


      setTimeout(
        function(){

          try{

            window.close();

          }
          catch(e){}

        },
        700
      );


    }
    else{

      setStatus(

        '✅ สแกนสำเร็จ<br>' +
        'Barcode: <b>' +
        escapeHtml(
          barcode
        ) +
        '</b>',

        'success'

      );


      retryBtn.style.display =
        'block';

    }

  }
  catch(error){

    console.error(
      error
    );

  }

}


/* =====================================================
   STOP
===================================================== */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){

    return;
  }


  const current =
    scanner;


  scanner = null;

  running = false;


  try{

    await current.stop();

  }
  catch(error){

    console.log(
      'Stop error:',
      error
    );

  }


  try{

    current.clear();

  }
  catch(error){

    console.log(
      'Clear error:',
      error
    );

  }

}


/* =====================================================
   RESTART
===================================================== */

async function restartScanner(){

  await stopScanner();


  scanned = false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  cameraSelect.style.display =
    'none';


  setStatus(
    'กำลังเตรียมกล้อง...',
    'info'
  );


  setTimeout(
    function(){

      startCamera();

    },
    300
  );

}


/* =====================================================
   CLOSE
===================================================== */

async function closeScanner(){

  await stopScanner();


  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(
        {
          type:
            'BARCODE_SCANNER_CLOSED'
        },
        '*'
      );

    }

  }
  catch(e){}


  try{

    window.close();

  }
  catch(e){}


  setTimeout(
    function(){

      if(
        !window.closed
      ){

        history.back();

      }

    },
    300
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  'beforeunload',
  function(){

    try{

      if(
        scanner &&
        running
      ){

        scanner
          .stop()
          .catch(
            function(){}
          );

      }

    }
    catch(e){}

  }
);

</script>

</body>

</html>
