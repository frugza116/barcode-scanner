<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>สแกน Barcode สินค้า</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde2e4,
      #e0f4ff
    );

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:flex-start;

  padding:12px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

  width:100%;

  max-width:500px;

  margin-top:5px;

}


/* =====================================================
   CARD
===================================================== */

.card{

  width:100%;

  background:#fff;

  border-radius:22px;

  padding:16px;

  box-shadow:
    0 10px 28px
    rgba(0,0,0,.16);

}


/* =====================================================
   TITLE
===================================================== */

.title{

  text-align:center;

  font-size:23px;

  font-weight:900;

  color:#4a148c;

  margin-bottom:5px;

}


.subtitle{

  text-align:center;

  color:#666;

  font-size:14px;

  line-height:1.5;

  margin-bottom:14px;

}


/* =====================================================
   READER
===================================================== */

#reader{

  width:100%;

  min-height:260px;

  overflow:hidden;

  border-radius:18px;

  background:#111;

}


#reader video{

  width:100% !important;

  height:auto !important;

  display:block;

  border-radius:18px;

}


#reader img{

  max-width:100%;

}


/* =====================================================
   STATUS
===================================================== */

.status{

  margin-top:14px;

  padding:12px 14px;

  border-radius:14px;

  text-align:center;

  font-size:14px;

  line-height:1.6;

}


.status.info{

  background:#ede7f6;

  color:#4a148c;

}


.status.success{

  background:#e8f5e9;

  color:#1b5e20;

}


.status.error{

  background:#ffebee;

  color:#b71c1c;

}


/* =====================================================
   RESULT
===================================================== */

.result{

  display:none;

  margin-top:14px;

  padding:16px;

  border-radius:16px;

  background:#f4effb;

  text-align:center;

}


.result-label{

  color:#666;

  font-size:13px;

  margin-bottom:6px;

}


.result-code{

  color:#4a148c;

  font-size:25px;

  line-height:1.3;

  font-weight:900;

  word-break:break-all;

}


/* =====================================================
   BUTTON
===================================================== */

button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:15px;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;

}


button:active{

  transform:scale(.98);

}


/* OPEN */

.open-btn{

  background:#4a148c;

  color:#fff;

}


/* RETRY */

.retry-btn{

  display:none;

  background:#4a148c;

  color:#fff;

}


/* CLOSE */

.close-btn{

  background:#eee;

  color:#555;

}


/* =====================================================
   HELP
===================================================== */

.help{

  margin-top:14px;

  padding:12px;

  border-radius:14px;

  background:#fafafa;

  color:#666;

  font-size:13px;

  line-height:1.6;

  text-align:center;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  body{

    padding:8px;

  }

  .card{

    padding:13px;

    border-radius:20px;

  }

  .title{

    font-size:21px;

  }

  #reader{

    min-height:240px;

  }

}

</style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- =================================================
         TITLE
    ================================================== -->

    <div class="title">

      📷 สแกน Barcode สินค้า

    </div>


    <div class="subtitle">

      หันกล้องหลังมือถือไปที่ Barcode<br>

      รองรับ Barcode สินค้าแบบ EAN-13

    </div>


    <!-- =================================================
         CAMERA
    ================================================== -->

    <div id="reader"></div>


    <!-- =================================================
         STATUS
    ================================================== -->

    <div
      id="status"
      class="status info">

      กดปุ่ม
      <b>📷 เปิดกล้อง</b>
      เพื่อเริ่มสแกน

    </div>


    <!-- =================================================
         RESULT
    ================================================== -->

    <div
      id="result"
      class="result">

      <div class="result-label">

        Barcode ที่สแกนได้

      </div>


      <div
        id="resultCode"
        class="result-code">

      </div>

    </div>


    <!-- =================================================
         OPEN CAMERA
    ================================================== -->

    <button
      id="openBtn"
      class="open-btn"
      onclick="startCamera()">

      📷 เปิดกล้อง

    </button>


    <!-- =================================================
         RETRY
    ================================================== -->

    <button
      id="retryBtn"
      class="retry-btn"
      onclick="restartScanner()">

      🔄 สแกนใหม่

    </button>


    <!-- =================================================
         CLOSE
    ================================================== -->

    <button
      class="close-btn"
      onclick="closeScanner()">

      ✕ ปิดหน้าสแกน

    </button>


    <!-- =================================================
         HELP
    ================================================== -->

    <div class="help">

      <b>วิธีใช้</b><br>

      1. กดเปิดกล้อง<br>

      2. อนุญาตให้เว็บไซต์ใช้กล้อง<br>

      3. นำ Barcode มาไว้ในกรอบ<br>

      4. เมื่อสแกนสำเร็จ ระบบจะส่งเลขกลับไปยังหน้าหลัก

    </div>


  </div>

</div>



<script>


/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let running = false;

let scanned = false;


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
  document.getElementById(
    'status'
  );


const resultEl =
  document.getElementById(
    'result'
  );


const resultCodeEl =
  document.getElementById(
    'resultCode'
  );


const openBtn =
  document.getElementById(
    'openBtn'
  );


const retryBtn =
  document.getElementById(
    'retryBtn'
  );


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  type = 'info'
){

  statusEl.innerHTML =
    message;

  statusEl.className =
    'status ' +
    type;

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  if(running){

    return;

  }


  scanned = false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  retryBtn.style.display =
    'none';


  openBtn.style.display =
    'none';


  setStatus(
    'กำลังตรวจสอบสิทธิ์การใช้กล้อง...',
    'info'
  );


  /* =================================================
     HTTPS CHECK
  ================================================= */

  if(
    location.protocol !== 'https:' &&
    location.hostname !== 'localhost'
  ){

    setStatus(
      '❌ หน้านี้ไม่ได้เปิดผ่าน HTTPS<br>' +
      'กล้องมือถือจำเป็นต้องใช้ HTTPS',
      'error'
    );


    openBtn.style.display =
      'block';


    return;

  }


  /* =================================================
     CHECK CAMERA API
  ================================================= */

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    setStatus(
      '❌ Browser นี้ไม่รองรับการใช้งานกล้อง',
      'error'
    );


    openBtn.style.display =
      'block';


    return;

  }


  /* =================================================
     ขอสิทธิ์กล้องโดยตรง
  ================================================= */

  let testStream = null;


  try{

    testStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:
            'environment'
        },

        audio:false

      });

  }

  catch(error){

    console.error(
      'Camera permission error:',
      error
    );


    let message =
      '❌ ไม่สามารถใช้กล้องได้';


    if(
      error &&
      error.name ===
      'NotAllowedError'
    ){

      message +=
        '<br><br>' +
        'Browser ไม่อนุญาตให้ใช้กล้อง' +
        '<br>' +
        'กรุณาตั้งค่า Camera เป็น Allow';

    }

    else if(
      error &&
      error.name ===
      'NotFoundError'
    ){

      message +=
        '<br><br>' +
        'ไม่พบกล้องบนอุปกรณ์';

    }

    else if(
      error &&
      error.name ===
      'NotReadableError'
    ){

      message +=
        '<br><br>' +
        'กล้องอาจถูกใช้งานโดยแอปอื่น';

    }

    else if(
      error &&
      error.name ===
      'SecurityError'
    ){

      message +=
        '<br><br>' +
        'Browser บล็อกการใช้กล้อง';

    }

    else{

      message +=
        '<br><br>' +
        'Error: ' +
        (
          error?.name ||
          'Unknown'
        );

    }


    setStatus(
      message,
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';


    return;

  }


  /* =================================================
     STOP TEST CAMERA
  ================================================= */

  if(testStream){

    testStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  setStatus(
    '✅ ได้รับสิทธิ์ใช้กล้องแล้ว<br>' +
    'กำลังเปิดตัว Scanner...',
    'success'
  );


  /* =================================================
     CREATE SCANNER
  ================================================= */

  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );


    running = true;

  }

  catch(error){

    console.error(
      'Create scanner error:',
      error
    );


    scanner = null;

    running = false;


    setStatus(
      '❌ ไม่สามารถสร้าง Scanner ได้<br>' +
      error,
      'error'
    );


    retryBtn.style.display =
      'block';


    openBtn.style.display =
      'block';


    return;

  }


  /* =================================================
     SCANNER CONFIG
  ================================================= */

  const config = {

    fps:10,

    qrbox:{
      width:280,
      height:160
    },

    aspectRatio:1.777

  };


  /* =================================================
     START HTML5 QRCODE
  ================================================= */

  scanner

    .start(

      /* ===============================================
         สำคัญ:
         html5-qrcode ต้องการ string
         =============================================== */

      'environment',

      config,

      onScanSuccess,

      onScanError

    )

    .then(
      function(){

        setStatus(
          '📷 กล้องพร้อมใช้งาน<br>' +
          'นำ Barcode มาไว้ในกรอบ',
          'success'
        );

      }
    )

    .catch(
      function(error){

        console.error(
          'Scanner start error:',
          error
        );


        running = false;

        scanner = null;


        setStatus(
          '❌ เปิด Scanner ไม่สำเร็จ<br><br>' +
          String(error),
          'error'
        );


        retryBtn.style.display =
          'block';


        openBtn.style.display =
          'block';

      }
    );

}


/* =====================================================
   SCAN SUCCESS
===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
){

  if(scanned){

    return;

  }


  const barcode =
    String(
      decodedText || ''
    ).trim();


  if(!barcode){

    return;

  }


  scanned = true;


  console.log(
    'Barcode detected:',
    barcode
  );


  /* =================================================
     SHOW RESULT
  ================================================= */

  resultCodeEl.textContent =
    barcode;


  resultEl.style.display =
    'block';


  setStatus(
    '✅ สแกน Barcode สำเร็จ',
    'success'
  );


  /* =================================================
     STOP CAMERA
  ================================================= */

  stopScanner()
    .finally(
      function(){

        sendBarcodeToParent(
          barcode
        );

      }
    );

}


/* =====================================================
   SCAN ERROR
===================================================== */

function onScanError(
  errorMessage
){

  /*
    ไม่ต้องแสดง Error ทุก Frame
  */

}


/* =====================================================
   SEND TO PARENT
===================================================== */

function sendBarcodeToParent(
  barcode
){

  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(

        {

          type:
            'BARCODE_SCANNED',

          barcode:
            barcode

        },

        '*'

      );


      console.log(
        'Barcode sent:',
        barcode
      );


      /*
        ปิดหน้าสแกนอัตโนมัติ
      */

      setTimeout(
        function(){

          try{

            window.close();

          }
          catch(e){

            console.log(
              e
            );

          }

        },
        700
      );


    }

    else{

      /*
        กรณีเปิด scanner.html ตรง ๆ
      */

      setStatus(

        '✅ สแกนสำเร็จ<br>' +
        'Barcode: <b>' +
        escapeHtml(
          barcode
        ) +
        '</b><br><br>' +
        'หน้านี้ไม่ได้ถูกเปิดจากระบบหลัก',

        'success'

      );


      retryBtn.style.display =
        'block';

    }

  }

  catch(error){

    console.error(
      'postMessage error:',
      error
    );


    setStatus(

      '✅ สแกนสำเร็จ<br>' +
      'Barcode: <b>' +
      escapeHtml(
        barcode
      ) +
      '</b>',

      'success'

    );


    retryBtn.style.display =
      'block';

  }

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){

    return;

  }


  const currentScanner =
    scanner;


  scanner = null;

  running = false;


  try{

    await currentScanner.stop();

  }

  catch(error){

    console.log(
      'Stop scanner error:',
      error
    );

  }


  try{

    currentScanner.clear();

  }

  catch(error){

    console.log(
      'Clear scanner error:',
      error
    );

  }

}


/* =====================================================
   RESTART
===================================================== */

async function restartScanner(){

  await stopScanner();


  scanned = false;


  resultEl.style.display =
    'none';


  resultCodeEl.textContent =
    '';


  setStatus(
    'กำลังเตรียมกล้อง...',
    'info'
  );


  setTimeout(
    function(){

      startCamera();

    },
    300
  );

}


/* =====================================================
   CLOSE
===================================================== */

async function closeScanner(){

  await stopScanner();


  /*
    แจ้งหน้าหลัก
  */

  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(

        {

          type:
            'BARCODE_SCANNER_CLOSED'

        },

        '*'

      );

    }

  }

  catch(error){

    console.log(
      'Close message error:',
      error
    );

  }


  /*
    พยายามปิด Window
  */

  try{

    window.close();

  }

  catch(error){

    console.log(
      error
    );

  }


  /*
    กรณี Browser ไม่ยอมปิด
  */

  setTimeout(
    function(){

      if(
        !window.closed
      ){

        history.back();

      }

    },
    300
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   PAGE EXIT
===================================================== */

window.addEventListener(
  'beforeunload',
  function(){

    try{

      if(
        scanner &&
        running
      ){

        scanner
          .stop()
          .catch(
            function(){}
          );

      }

    }

    catch(e){}

  }
);

</script>

</body>

</html>
